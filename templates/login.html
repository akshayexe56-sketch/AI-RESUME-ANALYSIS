{% extends 'base.html' %}
{% block title %}Sign In - ResumeAI{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 480px;">
    <div class="card border-0 rounded-4 shadow-sm p-4 p-md-5">
        <div class="text-center mb-4">
            <div class="brand-icon-box mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.5rem;">
                <i class="bi bi-file-earmark-check-fill"></i>
            </div>
            <h3 class="fw-bold">Sign In to ResumeAI</h3>
            <p class="text-muted small">Access your resume analyses, scores, and PDF reports.</p>
        </div>

        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label small fw-semibold">Username</label>
                <input type="text" name="username" class="form-control rounded-3" required autofocus placeholder="Enter your username">
            </div>
            <div class="mb-4">
                <label class="form-label small fw-semibold">Password</label>
                <input type="password" name="password" class="form-control rounded-3" required placeholder="Enter password">
            </div>
            <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-bold mb-3">Sign In</button>
            <div class="text-center small text-muted">
                Don't have an account? <a href="{% url 'register' %}" class="fw-bold text-primary text-decoration-none">Sign Up</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
