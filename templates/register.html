{% extends 'base.html' %}
{% block title %}Create Account - ResumeAI{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 520px;">
    <div class="card border-0 rounded-4 shadow-sm p-4 p-md-5">
        <div class="text-center mb-4">
            <div class="brand-icon-box mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.5rem;">
                <i class="bi bi-file-earmark-check-fill"></i>
            </div>
            <h3 class="fw-bold">Create Your Free Account</h3>
            <p class="text-muted small">Get instant ATS feedback, scores, and keyword comparisons.</p>
        </div>

        <form method="POST" action="{% url 'register' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label small fw-semibold">Username</label>
                <input type="text" name="username" class="form-control rounded-3" required placeholder="Choose a username">
            </div>
            <div class="mb-3">
                <label class="form-label small fw-semibold">Email Address</label>
                <input type="email" name="email" class="form-control rounded-3" required placeholder="you@domain.com">
            </div>
            <div class="row g-2 mb-3">
                <div class="col-6">
                    <label class="form-label small fw-semibold">Password</label>
                    <input type="password" name="password" class="form-control rounded-3" required placeholder="Password">
                </div>
                <div class="col-6">
                    <label class="form-label small fw-semibold">Confirm Password</label>
                    <input type="password" name="password2" class="form-control rounded-3" required placeholder="Repeat password">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-semibold">Account Role</label>
                <select name="role" class="form-select rounded-3">
                    <option value="jobseeker" selected>Job Seeker</option>
                    <option value="recruiter">Recruiter / Hiring Manager</option>
                </select>
            </div>
            <div class="mb-4">
                <label class="form-label small fw-semibold">Target Job Title (Optional)</label>
                <input type="text" name="target_job_title" class="form-control rounded-3" placeholder="e.g. Senior Software Engineer">
            </div>
            <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-bold mb-3">Create Account</button>
            <div class="text-center small text-muted">
                Already registered? <a href="{% url 'login' %}" class="fw-bold text-primary text-decoration-none">Sign In</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
