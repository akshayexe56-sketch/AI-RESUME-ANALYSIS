{% extends 'base.html' %}
{% block title %}User Profile - ResumeAI{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 600px;">
    <div class="card border-0 rounded-4 shadow-sm p-4 p-md-5">
        <h3 class="fw-bold mb-1">Your Profile</h3>
        <p class="text-muted small mb-4">Manage your role preferences and target career criteria.</p>

        <form method="POST" action="{% url 'profile' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label small fw-semibold">Username</label>
                <input type="text" class="form-control rounded-3" value="{{ request.user.username }}" disabled>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-semibold">Email Address</label>
                <input type="email" name="email" class="form-control rounded-3" value="{{ request.user.email }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-semibold">Role</label>
                <select name="role" class="form-select rounded-3">
                    <option value="jobseeker" {% if profile.role == 'jobseeker' %}selected{% endif %}>Job Seeker</option>
                    <option value="recruiter" {% if profile.role == 'recruiter' %}selected{% endif %}>Recruiter</option>
                    <option value="admin" {% if profile.role == 'admin' %}selected{% endif %}>Administrator</option>
                </select>
            </div>
            <div class="mb-4">
                <label class="form-label small fw-semibold">Target Job Title</label>
                <input type="text" name="target_job_title" class="form-control rounded-3" value="{{ profile.target_job_title|default:'' }}" placeholder="e.g. Full Stack Developer">
            </div>
            <button type="submit" class="btn btn-primary rounded-pill px-4 fw-bold">Save Changes</button>
        </form>
    </div>
</div>
{% endblock %}
